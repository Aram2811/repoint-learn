services:
  postgres:
    image: postgres:16-alpine
    container_name: repoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: repoint
      POSTGRES_PASSWORD: repoint_dev_pass
      POSTGRES_DB: repoint_dev
    ports:
      - "5432:5432"
    volumes:
      - repoint_pg_data:/var/lib/postgresql/data

volumes:
  repoint_pg_data:
